[build-system]
requires = []
build-backend = "pokemind_build_backend"
backend-path = ["scripts"]

[project]
name = "pokemind-local"
version = "0.9.1"
description = "Cerveau local sourcé pour Pokémon TCG Live"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sébastien Dubé" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]
desktop = ["PySide6==6.12.0; sys_platform != 'linux'", "PySide6==6.11.2; sys_platform == 'linux'", "tzdata==2026.5; sys_platform == 'win32'",
    "pyte==0.8.2", "wcwidth==0.2.13", "pywinpty==3.0.5; sys_platform == 'win32'"]
desktop-build = ["PySide6==6.12.0", "pyinstaller==6.22.3", "tzdata==2026.5; sys_platform == 'win32'",
    "pyte==0.8.2", "wcwidth==0.2.13", "pywinpty==3.0.5; sys_platform == 'win32'"]

[project.scripts]
pokemind = "pokemind.cli:main"

[project.gui-scripts]
pokemind-desktop = "pokemind.desktop.app:launch"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
